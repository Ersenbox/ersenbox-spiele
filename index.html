<html lang="de">
<head>

    <meta name="theme-color" content="#0D1B2A">

    <title>Ersenbox Spiele - Lernspiele</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --navy: #0D1B2A;
            --gold: #D4AF37;
            --light: #F5F5F5;
            --dark-gray: #2a3a4a;
            --success: #4CAF50;
            --warning: #FF6B6B;
            --purple: #9B59B6;
            --cyan: #4ECDC4;
            --pink: #FF69B4;
            --orange: #FF8C42;
            --yellow: #FFC93C;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #1a2e42 100%);
            color: var(--light);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        body.light-mode {
            background: linear-gradient(135deg, #FFF8DC 0%, #FFE4E1 100%);
            color: var(--navy);
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        header {
            background: linear-gradient(90deg, var(--navy), #1a3a4a);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }

        body.light-mode header {
            background: linear-gradient(90deg, #FFF, #FFE4E1);
            border-bottom-color: var(--orange);
        }

        .header-title {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        body.light-mode .header-title {
            color: var(--orange);
        }

        .emoji-title {
            font-size: 1.8em;
            animation: bounce 2s infinite;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background: var(--gold);
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s ease;
            color: var(--navy);
        }

        body.light-mode .control-btn {
            background: var(--orange);
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            scrollbar-width: none;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* Menu */
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.5s ease;
        }

        .game-card {
            background: linear-gradient(135deg, var(--gold), #c99a27);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

        .game-card:active {
            transform: scale(0.95);
        }

        body.light-mode .game-card {
            background: linear-gradient(135deg, var(--orange), #ff6b35);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }

        .game-card-emoji {
            font-size: 2.5em;
            z-index: 1;
            animation: float 3s ease-in-out infinite;
        }

        .game-card-text {
            font-weight: bold;
            color: var(--navy);
            font-size: 1em;
            text-align: center;
            z-index: 1;
        }

        body.light-mode .game-card-text {
            color: white;
        }

        /* Star Counter */
        .star-counter {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--gold);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 90;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
            font-size: 1.1em;
        }

        body.light-mode .star-counter {
            background: var(--orange);
            color: white;
        }

        .star-icon {
            font-size: 1.5em;
            animation: spin 2s linear infinite;
        }

        /* Game Screen */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-height: 100%;
            overflow: auto;
            animation: slideIn 0.3s ease;
        }

        .game-screen.active {
            display: flex;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            z-index: 120;
            transition: all 0.3s ease;
            display: none;
        }

        body.light-mode .back-btn {
            background: var(--orange);
            color: white;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        .back-btn.show {
            display: block;
        }

        /* Canvas Drawing */
        .canvas-container {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
            border-radius: 10px;
            touch-action: none;
        }

        /* Game Controls */
        .game-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-btn, .option-btn {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        body.light-mode .game-btn,
        body.light-mode .option-btn {
            background: var(--orange);
            color: white;
        }

        .game-btn:hover, .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .game-btn:active, .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 15px;
        }

        .option-btn.correct {
            background: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            background: var(--warning);
            color: white;
        }

        /* Game Display */
        .game-display {
            font-size: 4em;
            font-weight: bold;
            color: var(--gold);
            text-align: center;
            min-height: 80px;
            animation: slideDown 0.5s ease;
        }

        body.light-mode .game-display {
            color: var(--orange);
        }

        .question-text {
            font-size: 1.5em;
            color: var(--gold);
            text-align: center;
            font-weight: bold;
        }

        body.light-mode .question-text {
            color: var(--orange);
        }

        /* Message */
        .message {
            font-size: 2em;
            font-weight: bold;
            min-height: 50px;
            animation: fadeIn 0.5s ease;
            text-align: center;
        }

        .message.correct {
            color: var(--success);
        }

        .message.incorrect {
            color: var(--warning);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        /* Image Display */
        .image-display {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: popIn 0.5s ease;
        }

        /* Achievements */
        .achievement-popup {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--gold);
            color: var(--navy);
            padding: 20px 30px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 5px 25px rgba(212, 175, 55, 0.5);
            animation: slideUp 0.5s ease;
            z-index: 200;
        }

        body.light-mode .achievement-popup {
            background: var(--orange);
            color: white;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg) translate(-50%, -50%); }
            100% { transform: rotate(360deg) translate(-50%, -50%); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-display {
                font-size: 3em;
            }

            header {
                padding: 10px 15px;
            }

            .header-title {
                font-size: 1.2em;
            }

            .content {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .menu {
                grid-template-columns: 1fr;
            }

            .game-display {
                font-size: 2.5em;
            }

            .star-counter {
                top: 70px;
                right: 10px;
                font-size: 0.9em;
            }

            .back-btn {
                left: 10px;
                padding: 8px 15px;
                font-size: 0.9em;
            }
        }

        /* Language Text */
        .lang-name {
            font-size: 0.8em;
            opacity: 0.8;
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            background: var(--navy);
            border: 3px solid var(--gold);
            border-radius: 15px;
            padding: 15px;
            z-index: 150;
            display: none;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        body.light-mode .settings-panel {
            background: white;
            color: var(--navy);
            border-color: var(--orange);
        }

        .settings-panel.show {
            display: flex;
        }

        .settings-label {
            font-weight: bold;
            color: var(--gold);
            font-size: 0.9em;
        }

        body.light-mode .settings-label {
            color: var(--orange);
        }

        .lang-select {
            background: var(--gold);
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: var(--navy);
        }

        body.light-mode .lang-select {
            background: var(--orange);
            color: white;
        }

        .mode-toggle {
            background: var(--gold);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: var(--navy);
            font-size: 0.9em;
        }

        body.light-mode .mode-toggle {
            background: var(--orange);
            color: white;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <span class="emoji-title">🎮</span>
                <span id="headerTitle">Ersenbox Spiele</span>
            </div>
            <div class="header-controls">
                <button class="control-btn" id="settingsBtn" onclick="toggleSettings()">⚙️</button>
            </div>
        </header>

        <!-- Star Counter -->
        <div class="star-counter">
            <span class="star-icon">⭐</span>
            <span id="starCount">0</span>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-label">🌍 Sprache / Dil / Language</div>
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="de">🇩🇪 Deutsch</option>
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="en">🇬🇧 English</option>
            </select>
            <div class="settings-label">🌙 Modus / Kip / Mode</div>
            <button class="mode-toggle" id="modeToggle" onclick="toggleDarkMode()">🌙 Dunkel</button>
        </div>

        <!-- Back Button -->
        <button class="back-btn" id="backBtn" onclick="goBackToMenu()">← Zurück</button>

        <!-- Main Content -->
        <div class="content" id="content">
            <!-- Menu -->
            <div class="menu" id="menuGrid"></div>

            <!-- Game Screens -->
            <div class="game-screen" id="gameColors">
                <div class="question-text" id="colorQuestion">Wähle die Farbe</div>
                <div class="game-display" id="colorDisplay"></div>
                <div class="options-grid" id="colorOptions"></div>
                <div class="message" id="colorMessage"></div>
            </div>

            <div class="game-screen" id="gameShapes">
                <div class="question-text" id="shapeQuestion">Wähle die Form</div>
                <div class="game-display" id="shapeDisplay"></div>
                <div class="options-grid" id="shapeOptions"></div>
                <div class="message" id="shapeMessage"></div>
            </div>

            <div class="game-screen" id="gameNumbers">
                <div class="question-text" id="numberQuestion">Zähle die Objekte</div>
                <div class="game-display" id="numberDisplay"></div>
                <div class="options-grid" id="numberOptions"></div>
                <div class="message" id="numberMessage"></div>
            </div>

            <div class="game-screen" id="gameLetters">
                <div class="question-text" id="letterQuestion">Welcher Buchstabe?</div>
                <div class="game-display" id="letterDisplay">A</div>
                <div class="game-controls">
                    <button class="game-btn" onclick="speakLetter()">🔊 Höre zu</button>
                    <button class="game-btn" onclick="nextLetter()">→ Nächster</button>
                </div>
            </div>

            <div class="game-screen" id="gameDrawing">
                <div class="question-text" id="drawQuestion">Zeichne den Buchstaben</div>
                <div class="canvas-container">
                    <canvas id="drawCanvas" width="300" height="300"></canvas>
                </div>
                <div class="game-controls">
                    <button class="game-btn" onclick="clearCanvas()">🗑️ Löschen</button>
                    <button class="game-btn" onclick="checkDrawing()">✓ Überprüfen</button>
                </div>
                <div class="message" id="drawMessage"></div>
            </div>

            <div class="game-screen" id="gameMatching">
                <div class="question-text" id="matchQuestion">Verbinde die Paare</div>
                <div class="options-grid" id="matchOptions"></div>
                <div class="message" id="matchMessage"></div>
            </div>

            <div class="game-screen" id="gameQuiz">
                <div class="question-text" id="quizQuestion">Beantworte die Frage</div>
                <div class="options-grid" id="quizOptions"></div>
                <div class="message" id="quizMessage"></div>
            </div>

            <div class="game-screen" id="gameSorting">
                <div class="question-text" id="sortQuestion">Sortiere nach Farbe</div>
                <div class="options-grid" id="sortOptions"></div>
                <div class="message" id="sortMessage"></div>
            </div>

            <div class="game-screen" id="gamePuzzle">
                <div class="question-text" id="puzzleQuestion">Finde das richtige Stück</div>
                <div class="game-display" id="puzzleDisplay"></div>
                <div class="options-grid" id="puzzleOptions"></div>
                <div class="message" id="puzzleMessage"></div>
            </div>
        </div>
    </div>

        const games = [

        function changeLanguage(lang) {
            currentLang = lang;
            updateUI();
            localStorage.setItem('preferredLang', lang);
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode');
            localStorage.setItem('darkMode', isDarkMode);
            updateModeButton();
        }

        function updateModeButton() {
            const btn = document.getElementById('modeToggle');
            btn.textContent = isDarkMode ? '🌙 Dunkel' : '☀️ Hell';

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }

        function updateUI() {
            document.getElementById('headerTitle').textContent = getString('headerTitle');
            document.getElementById('backBtn').textContent = getString('back');
            document.getElementById('langSelect').value = currentLang;
            
            // Update game cards
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-card-emoji">${game.emoji}</div>
                    <div class="game-card-text">${getString(game.name)}</div>
                `;
                card.onclick = () => startGame(game.id);
                grid.appendChild(card);
            });
        }

        function startGame(gameId) {
            currentGame = gameId;
            document.getElementById('backBtn').classList.add('show');
            
            // Hide menu, show game
            document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game' + gameId.charAt(0).toUpperCase() + gameId.slice(1)).classList.add('active');
            
            // Initialize game
            if (gameId === 'colors') initColors();
            if (gameId === 'shapes') initShapes();
            if (gameId === 'numbers') initNumbers();
            if (gameId === 'letters') initLetters();
            if (gameId === 'drawing') initDrawing();
            if (gameId === 'matching') initMatching();
            if (gameId === 'quiz') initQuiz();
            if (gameId === 'sorting') initSorting();
            if (gameId === 'puzzle') initPuzzle();
            
            playGameSound();
        }

        // DRAWING GAME
        let canvas, ctx;

        function initDrawing() {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#0D1B2A';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }

        let isDrawing = false;

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function handleTouch(e) {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.closePath();
        }

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('drawMessage').textContent = '';
        }

        function checkDrawing() {
            earnStar();
            document.getElementById('drawMessage').textContent = getString('correct');
            document.getElementById('drawMessage').className = 'message correct';
            setTimeout(() => {
                clearCanvas();

            }, 1000);
        }

        // Utilities
        function earnStar() {
            stars++;
            document.getElementById('starCount').textContent = stars;
            localStorage.setItem('stars', stars);
            playSuccessSound();
        }

        function playGameSound() {
            // Simple beep using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 523.25;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [659, 784];
            
            notes.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const time = audioContext.currentTime + (i * 0.1);
                gainNode.gain.setValueAtTime(0.3, time);
                gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                
                oscillator.start(time);
                oscillator.stop(time + 0.2);
            });
        }

        // Initialize
        window.onload = () => {
            // Load preferences
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang) currentLang = savedLang;
            
            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode === 'false') {
                isDarkMode = false;
                document.body.classList.add('light-mode');
            }
            
            const savedStars = localStorage.getItem('stars');
            if (savedStars) {
                stars = parseInt(savedStars);
                document.getElementById('starCount').textContent = stars;
            }
            
            // Initialize UI
            updateUI();
            updateModeButton();
            
            // Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open('ersenbox-v1').then(cache => {
                            return cache.addAll([]);
                        }));
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `)).catch(() => {});
            }
        };
